name: "Approve Dependabot PR's" 
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@273073a94b9e270dfc538a72602cb39c85685b90 # main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
