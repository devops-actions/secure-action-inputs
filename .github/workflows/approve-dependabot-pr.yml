name: "Approve Dependabot PR's" 
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@1ee1515c3cbefa23a39b2592211075e13e98d421 # main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
