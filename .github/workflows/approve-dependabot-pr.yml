name: "Approve Dependabot PR's" 
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@8d8663c88ecbf1ec0da06c0e830055512a6b3890 # main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
