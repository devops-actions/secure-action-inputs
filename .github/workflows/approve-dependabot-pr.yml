name: "Approve Dependabot PR's" 
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@97cb794781522d095e049b3201323325c30d4fad # main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
