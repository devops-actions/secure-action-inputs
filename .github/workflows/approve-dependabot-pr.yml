name: "Approve Dependabot PR's" 
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@bb1b429a44f5ffc7d548bd55f4f792a2de7ab083 # main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
